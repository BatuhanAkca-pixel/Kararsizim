<header class="site-header">
  <nav class="page-shell nav" aria-label="Ana menü">
    <a class="brand" href="{% url 'home' %}">kararsızım.</a>
    <div class="nav-actions">
      {% if user.is_authenticated %}
        <span class="user-label">@{{ user.username }}</span>
        <a class="button button-quiet nav-secondary" href="{% url 'polls:mine' %}">Anketlerim</a>
        <a class="button button-primary nav-secondary" href="{% url 'polls:create' %}">Anket oluştur</a>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button class="button button-quiet" type="submit">Çıkış yap</button>
        </form>
      {% else %}
        <a class="button button-quiet" href="{% url 'accounts:login' %}">Giriş yap</a>
        <a class="button button-primary" href="{% url 'accounts:register' %}">Kayıt ol</a>
      {% endif %}
    </div>
  </nav>
</header>
